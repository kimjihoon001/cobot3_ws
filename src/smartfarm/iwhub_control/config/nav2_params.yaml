# iw.hub Nav2 파라미터 (ROS2 Humble). 위치추정 = AMCL(정적 맵 + 라이다 매칭).
#   맵 = maps/greenhouse.yaml (IW 전용, Isaac 월드 좌표에 정렬).
# ★ Nova Carter 규칙 스캔 2기: /front_2d_lidar/scan + /back_2d_lidar/scan.
#   AMCL 은 전방 스캔 1개로 맵 매칭, 코스트맵은 둘 다 사용한다.
# TF: map(amcl)→odom(base_node)→base_link→laser_front/back(Isaac).

amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "iwhub_0/base_link"
    odom_frame_id: "iwhub_0/odom"
    global_frame_id: "iwhub_0/map"
    scan_topic: front_2d_lidar/scan_filtered
    # IW 전용 맵은 Isaac 월드 좌표에 정렬되어 있다.
    set_initial_pose: true
    initial_pose: {x: 1.6955, y: -12.0, z: 0.0, yaw: 3.141592653589793}
    laser_model_type: "likelihood_field"
    max_beams: 180
    min_particles: 800
    max_particles: 3000
    # 실제 코스트맵 관측 범위와 맞춰 멀리서 들어온 노이즈의 영향을 줄인다.
    laser_max_range: 25.0
    laser_min_range: 0.05                   # Nova Carter RPLIDAR S2E 프로파일
    # 바퀴 odom의 누적 회전/직진 오차가 코스트맵에 쌓이기 전에 자주 보정한다.
    update_min_a: 0.05
    update_min_d: 0.05
    resample_interval: 1
    transform_tolerance: 1.0
    # 충돌·헛돌기가 있는 시뮬 차체의 엔코더 odom을 과신하지 않도록
    # 이동 노이즈를 높이고, 정적맵과 맞는 라이다 점에 더 큰 가중치를 준다.
    alpha1: 0.35
    alpha2: 0.35
    alpha3: 0.30
    alpha4: 0.30
    z_hit: 0.80
    z_rand: 0.20
    sigma_hit: 0.12
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    # map→odom의 단일 발행자는 AMCL이다. 고정 TF와 중복 발행하지 않는다.
    tf_broadcast: true

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "iwhub_0/map"
    yaml_filename: ""                       # launch 에서 map 인자로 채움

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: iwhub_0/map
    robot_base_frame: iwhub_0/base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 움직이는 FOLLOW goal을 후진으로 추종할 때 곡선 정렬 구간을 실패로
      # 오인하지 않되, 실제 정지는 계속 검출한다.
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # FOLLOW에는 현재 브랜치의 안정적인 허용오차를 유지한다. FORKLIFT는 이
      # 반경에 들어온 뒤 별도 저속 폐루프가 위치·yaw를 정밀하게 마무리한다.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      # 레인·swept-footprint가 안전한 전역 경로를 만들고 DWB가 로컬 장애물
      # 궤적을 비교한다. 긴 후방 오버행의 임의 후진을 막기 위해 min_vel_x=0이다.
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.50
      max_vel_theta: 0.80
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_theta: 1.6
      decel_lim_x: -1.5
      decel_lim_theta: -2.0
      vx_samples: 25
      vtheta_samples: 35
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      # 기존 0.05는 경로 관련 critic(18~32)에 비해 장애물 비용을 사실상
      # 무시해 고속 주행 시 회피가 너무 늦었다. 최고속도는 유지하되 장애물
      # 근접 궤적이 일찍 탈락하도록 기본값보다 약간 강하게 평가한다.
      BaseObstacle.scale: 2.0
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.35
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.35
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      # RViz가 시뮬 시간 재시작 직후의 첫 full map을 오래된 TF로 폐기해도 다음 주기에
      # 최신 전체 맵을 다시 받을 수 있게 한다(증분 업데이트만으로는 복구되지 않는다).
      always_send_full_costmap: true
      # 로컬 제어는 연속적인 odom 기준으로 계산해 AMCL(map→odom) 보정 점프가
      # 즉시 조향 명령을 흔들지 않게 한다. 정적맵은 global_costmap에서 사용한다.
      global_frame: iwhub_0/odom
      robot_base_frame: iwhub_0/base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # IW 차체뿐 아니라 폭 0.802m 팔레트/KLT 적재 외곽을 로컬 충돌 검사에
      # 사용한다. 회전·TF·5cm costmap 셀 오차를 흡수하도록 모든 방향에
      # 5cm padding을 추가한다.
      # 앞/뒤 라이다 프레임(+0.65 / -1.08)이 실제 스캔 원점이라 footprint 앞/뒤를
      # 거기까지 맞춘다(폭 ±0.401 유지). 브래킷은 없지만 스캔·충돌 외곽 기준은 라이다다.
      footprint: "[[0.65, 0.401], [0.65, -0.401], [-1.08, -0.401], [-1.08, 0.401]]"
      footprint_padding: 0.05
      # 중앙 측면은 두 라이다 모두 최소 감지거리 안쪽이 될 수 있다. 정적 벽이 스캔에서
      # 사라져도 ObstacleFootprint가 계속 검사하도록 static layer를 로컬에도 유지한다.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan_front scan_back
        scan_front:
          topic: front_2d_lidar/scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          raytrace_max_range: 25.0
        scan_back:
          topic: back_2d_lidar/scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          raytrace_max_range: 25.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 로컬 안전 여유 띠. inscribed_radius(local footprint 0.376) 이상이어야 유효 —
        # 0.55로. 그라디언트라 조기정지 아님(레인 중심선은 배드서 1.24m라 무비용).
        cost_scaling_factor: 6.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      # RViz가 시뮬 타임라인 재시작 직후 첫 latched map을 놓쳐도 다음 주기에
      # 전체 글로벌 코스트맵을 다시 발행해 스스로 복구하게 한다.
      always_send_full_costmap: true
      global_frame: iwhub_0/map
      robot_base_frame: iwhub_0/base_link
      # 계획 단계에서는 회전 중 팔레트 앞 모서리가 베드에 붙지 않도록 실제 외곽보다
      # 앞/좌우로 5cm 넓힌다. 로컬 정지 footprint와 분리해 조기 정지는 만들지 않는다.
      footprint: "[[0.70, 0.451], [0.70, -0.451], [-1.08, -0.401], [-1.08, 0.401]]"
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan_front scan_back
        scan_front:
          topic: front_2d_lidar/scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 20.0
          raytrace_max_range: 25.0
        scan_back:
          topic: back_2d_lidar/scan_filtered
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 20.0
          raytrace_max_range: 25.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius는 반드시 inscribed_radius(global footprint 0.436) 이상이어야 충돌모델이
        # 유효하다(Nav2 경고). 배드 회피는 레인 경로(lanes.py, 1.24m 클리어)가 담당하므로 여유는
        # 크게 두지 않되, 로봇 반경보단 크게 0.55로. (이전 0.12는 라이다 self-return 오판 근거였음 —
        # 실제 -1.0은 Isaac no-hit 센티넬로 costmap이 버림. 정지 원인은 BT 프레임 버그였고 수정됨.)
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 차동구동의 제자리 회전을 활용한다. Hybrid-A*는 목표 자세를 곡률 경로로
      # 만족시키려 큰 원을 만들므로, A*는 위치 경로만 만들고 방향은 RPP가 제자리에서 맞춘다.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    # Humble 기본 BT는 활성화할 때 spin action server의 존재를 요구한다. 서버는 등록하되
    # 이 병합의 전진 전용 BT에서는 실패 복구용 Spin/BackUp을 호출하지 않는다.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: iwhub_0/odom
    robot_base_frame: iwhub_0/base_link
    transform_tolerance: 0.1
    cycle_frequency: 10.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.60
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.65, 0.0, 0.80]
    # DWB min_vel_x=0.0과 함께 후진 속도를 막는다. 좁은 아일서 임의 후진 불가.
    min_velocity: [0.0, 0.0, -0.80]
    max_accel: [1.2, 0.0, 1.6]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
