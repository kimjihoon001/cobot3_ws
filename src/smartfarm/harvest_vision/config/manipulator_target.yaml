manipulator_target_node:
  ros__parameters:
    input_topic: /vision/approach_target
    validated_topic: /harvester_0/manipulator/validated_target
    output_topic: /harvester_0/manipulator/target_pose
    isaac_command_topic: /harvester_0/cmd
    target_class_topic: /vision/target_class
    state_topic: /harvester_0/manipulator/target_state
    rmp_status_topic: /harvester_0/rmpflow/status
    basket_pose_topic: /iw/basket/empty_slot_pose
    basket_pose_max_age_sec: 2.0
    # 실제 슬롯 pose가 WAIT_BASKET 진입 후 정지 상태로 2초 연속 관측돼야 한다.
    # IW TF 폴백은 정차 여부를 증명할 수 없으므로 통합 운전에서는 사용하지 않는다.
    use_iw_tf_basket_fallback: false
    basket_stable_sec: 2.0
    iw_base_frame: iwhub_0/base_link
    # 팔레트 중심은 base_link가 아니라 실측 chassis bbox 중심(-0.3171 m)이다.
    # 격자 ±0.465/±0.155 + 이 오프셋 = 실제 release pose (8칸 모두 빈 슬롯).
    iw_empty_basket_offsets: [
      -0.782, -0.125, 0.587,
      -0.782, 0.125, 0.587,
      -0.472, -0.125, 0.587,
      -0.472, 0.125, 0.587,
      -0.162, -0.125, 0.587,
      -0.162, 0.125, 0.587,
      0.148, -0.125, 0.587,
      0.148, 0.125, 0.587
    ]
    harvest_enable_topic: harvest_test/enable
    external_harvest_gate_enabled: false
    mobility_ready_topic: /harvester_0/manipulator/mobility_ready
    # fleet_dispatch/harvester_nav2.launch.py 기본 namespace가 비어 있으므로 TF도 base_link다.
    base_frame: base_link

    # 캘리브레이션과 dry-run 확인 전에는 절대로 true로 바꾸지 않는다.
    command_enabled: false
    max_target_age_sec: 0.5
    tf_timeout_sec: 0.2
    max_jump_m: 0.5
    auto_grasp_enabled: true
    pregrasp_clearance_m: 0.15
    # 선택 시점 경로: 최종보다 5cm 위 PREGRASP에서 시작해
    # 2.5cm 위 보조점을 거쳐 CIRC로 최종점까지 내려간다.
    circ_entry_back_m: 0.17
    circ_entry_radius_scale: 0.0
    circ_entry_radius_lift_scale: -1.0
    circ_entry_min_back_m: 0.06
    circ_entry_drop_m: 0.10
    circ_vertical_descent_m: 0.05
    lin_approach_m: 0.10
    scoop_outer_radius_m: 0.057
    circ_clearance_margin_m: 0.019
    approach_vertical_offset_m: 0.025
    # 최종 CIRC에서 harvest_tcp XYZ를 토마토 기하 중심과 정확히 일치시킨다.
    grasp_vertical_offset_m: 0.0
    grasp_half_fruit_height_scale: 0.0
    sim_fruit_height_fallback_m: 0.068
    sim_fruit_radius_fallback_m: 0.034
    reacquire_max_m: 0.12
    capture_abort_m: 0.07
    capture_deadband_m: 0.008
    capture_trim_max_m: 0.035
    tool_grasp_reach_m: 0.132
    motion_timeout_sec: 10.0
    # 수용부 닫힘과 TCP 근접을 확인한 다음 외측 칼날이 50°에 도달해야 꽃자루를 해제한다.
    gripper_close_settle_sec: 1.5
    blade_cut_deg: 50.0
    blade_cut_complete_deg: 40.0
    blade_motion_timeout_sec: 8.0
    blade_open_deg: 0.0
    blade_angle_tolerance_deg: 1.0
    grasp_tcp_max_distance_m: 0.09
    grasp_verify_retract_m: 0.03
    grasp_follow_max_delta_m: 0.015
    # 한쪽 손가락만 접촉하면 닿은 방향으로 손목을 5도 보정해 한 번 재파지한다.
    grasp_one_side_yaw_deg: 5.0
    grasp_one_side_max_retries: 1
    # IW(바스켓) 없으면 파지한 채 홈으로 복귀(그리퍼 안 엶). True 라 RETRACT→_send_home.
    home_after_attempt: true
    retry_after_failure: false
    # 기존 릴리즈 TCP 높이에서 20mm 더 낮춘다.
    # 슬롯 pose 기준 +14mm이며 스쿱 최저점은 KLT 윗면보다 약 10mm 낮다.
    basket_approach_height_m: 0.014
    # 접힘 자세에서 바구니 pose를 기다리는 시간(일반 motion_timeout_sec와 분리).
    basket_wait_timeout_sec: 2.0
    # KLT는 MM 측후방에 놓인다. 축정렬 상자가 아니라 수평 반경으로 판정한다.
    basket_max_reach_m: 1.45
    basket_z_min: 0.15
    basket_z_max: 1.80
    # KLT 중심에서 XY 평면상 MM base_link 원점 방향으로 80mm 이동한 릴리즈점.
    basket_place_toward_mm_m: 0.08

    # base_frame 기준 허용 작업영역 [x, y, z] (m). 실제 로봇/환경에 맞춰 축소한다.
    # 팔을 대각선으로 완전히 펴는 자세도 허용한다. 최종 안전 한계는 별도의
    # workspace_max_xy_radius_m=1.40으로 제한한다.
    workspace_min: [0.15, -1.05, 0.15]
    workspace_max: [1.25, 1.05, 1.80]
